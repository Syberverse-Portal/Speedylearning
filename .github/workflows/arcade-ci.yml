name: Nova Forge arcade QA

on:
  push:
    branches:
      - main
      - feature/original-arcade-maths-console-v1-20261018
    paths:
      - games/**
      - tests/nova-*.test.cjs
      - .github/workflows/arcade-ci.yml
      - index.html
      - scripts/build-static.mjs
      - learning-sw.js
  workflow_dispatch:

permissions:
  contents: read

jobs:
  playable-and-accurate:
    name: Validate maths game, controls and mission generation
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Check original game JavaScript and every mission generator
        run: |
          node --check games/maths-data.js
          node --check games/arcade.js
          node --check games/expedition.js
          node --check tests/nova-maths.test.cjs
          node --check tests/nova-interaction.test.cjs
      - name: Run built-in Node tests — no paid dependencies
        run: node --test tests/nova-maths.test.cjs tests/nova-interaction.test.cjs
      - name: Verify production static game assets
        run: |
          node scripts/build-static.mjs
          test -s dist/games/index.html
          test -s dist/games/arcade.css
          test -s dist/games/expedition.js
          test -s dist/games/expedition.css
          test -s dist/games/arcade.js
          test -s dist/games/maths-data.js
          echo "All original game files are ready for Cloudflare Workers."

  browser-integration:
    name: Play original arcade in desktop and mobile Chromium
    needs: playable-and-accurate
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Install free browser-test dependencies
        run: |
          npm install --no-save playwright
          npx playwright install chromium --with-deps
      - name: Prepare exact Cloudflare static assets
        run: node scripts/build-static.mjs
      - name: Browser-play on desktop and touch mobile
        run: |
          python3 -m http.server 8765 --directory dist > /tmp/nova-server.log 2>&1 &
          sleep 2
          node tests/nova-browser.cjs
      - name: Keep game visual-check screenshots
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nova-forge-visual-check
          path: /tmp/nova-*.png
          if-no-files-found: ignore
